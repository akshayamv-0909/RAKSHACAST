<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RakshaCast | National Disaster Early Warning System</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a192f">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gov: {
                            navy: "#0a192f",
                            blue: "#1e3a8a",
                            saffron: "#ea580c",
                            gold: "#d97706",
                            green: "#15803d",
                            surface: "#ffffff",
                            bg: "#f1f5f9",
                            card: "#ffffff",
                            border: "#cbd5e1"
                        }
                    },
                    fontFamily: {
                        sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #0f172a;
            color: #0f172a;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Clean Mobile Phone Shell */
        .mobile-shell {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        @media (min-width: 640px) {
            .mobile-shell {
                min-height: 890px;
                max-height: 92vh;
                margin: 20px auto;
                border-radius: 40px;
                border: 10px solid #1e293b;
                overflow: hidden;
            }
        }

        /* Android Clean Status Bar */
        .android-status-bar {
            height: 28px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            background: #0f172a;
            z-index: 50;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .leaflet-container {
            font-family: inherit;
        }
    </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen text-slate-800">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 z-[9999] flex flex-col space-y-2 pointer-events-none px-4 w-full max-w-sm"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-[9000] hidden items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-xs p-0 sm:p-4"></div>

    <!-- MOBILE PHONE FRAME -->
    <div class="mobile-shell">

        <!-- 1. ANDROID STATUS BAR -->
        <div class="android-status-bar">
            <span id="android-clock">11:30 AM</span>
            <div class="flex items-center space-x-2">
                <span class="text-[9px] px-1.5 py-0.2 rounded bg-emerald-600 text-white font-bold">5G GPS</span>
                <i data-lucide="wifi" class="w-3.5 h-3.5 text-slate-300"></i>
                <i data-lucide="battery-charging" class="w-4 h-4 text-emerald-400"></i>
            </div>
        </div>

        <!-- 2. OFFICIAL GOVERNMENT HEADER (Clean Indian National Tricolor Emblem Style) -->
        <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-950 text-white px-4 py-3 shadow-md z-40 sticky top-0 border-b-2 border-orange-500">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <!-- National Shield Emblem -->
                    <div class="w-9 h-9 rounded-xl bg-white flex items-center justify-center shadow text-blue-900 font-black text-base border-2 border-orange-500">
                        🏛️
                    </div>
                    <div>
                        <div class="flex items-center space-x-1.5">
                            <span class="font-black text-sm tracking-tight text-white">RakshaCast</span>
                            <span class="text-[9px] bg-orange-500 text-white font-bold px-1.5 py-0.2 rounded uppercase">MoES / IMD</span>
                        </div>
                        <p class="text-[9px] text-blue-200 font-medium">National Disaster Early Warning Network</p>
                    </div>
                </div>

                <!-- Role & Simulation Switcher -->
                <div class="flex items-center space-x-1.5">
                    <button onclick="toggleAuthorityMode()" id="role-toggle-btn" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-blue-800 text-blue-100 hover:bg-blue-700 transition border border-blue-600">
                        👤 Citizen View
                    </button>
                    <button onclick="runSimulationSequence()" title="1-Click Emergency Test" class="p-1.5 rounded-lg bg-orange-500 text-white hover:bg-orange-600 transition shadow">
                        <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 3. SCROLLABLE SCREEN CONTENT CONTAINER -->
        <div id="screen-viewport" class="flex-1 overflow-y-auto custom-scrollbar p-3.5 space-y-3.5 pb-24 bg-slate-100">
            <!-- Dynamic Screen Views -->
        </div>

        <!-- 4. FLOATING SOS EMERGENCY BUTTON -->
        <div id="floating-sos-deck" class="absolute bottom-20 right-4 z-40">
            <button onclick="navigate('sos')" class="w-14 h-14 rounded-full bg-red-600 text-white flex flex-col items-center justify-center shadow-xl border-2 border-white active:scale-95 transition hover:bg-red-700">
                <i data-lucide="radio" class="w-5 h-5"></i>
                <span class="text-[8px] font-black uppercase tracking-wider">SOS</span>
            </button>
        </div>

        <!-- 5. ANDROID BOTTOM NAVIGATION BAR (Clean White / Blue Accent) -->
        <nav id="bottom-tab-bar" class="bg-white border-t border-slate-300 px-2 py-2 flex items-center justify-around z-50 absolute bottom-0 w-full shadow-lg">
            <!-- Bottom Tabs populated dynamically -->
        </nav>

    </div>

    <!-- APP SCRIPT -->
    <script src="/mobile-app.js"></script>
    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById("android-clock").innerText = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }, 1000);
        lucide.createIcons();
    </script>
</body>
</html>
